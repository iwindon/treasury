name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  RESOURCE_GROUP: treasury-rg
  APP_NAME: label-ocr

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in ACR
        run: |
          az acr build -r "${{ vars.ACR_NAME }}" \
            -t "${APP_NAME}:${{ github.sha }}" -t "${APP_NAME}:latest" .

      - name: Update container app
        run: |
          az extension add --name containerapp --upgrade -y
          az containerapp update -n "$APP_NAME" -g "$RESOURCE_GROUP" \
            --image "${{ vars.ACR_NAME }}.azurecr.io/${APP_NAME}:${{ github.sha }}"
